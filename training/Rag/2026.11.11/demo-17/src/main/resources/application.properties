spring.application.name=demo-17

# Server
server.port=8080
spring.application.name=deepwiki-agent

# OpenAI
spring.ai.openai.api-key=${OPENAI_API_KEY}
spring.ai.openai.chat.options.model=gpt-4o-mini
spring.ai.openai.chat.options.temperature=0.2

# MCP Client
spring.ai.mcp.client.enabled=true
spring.ai.mcp.client.type=SYNC
spring.ai.mcp.client.request-timeout=60s
spring.ai.mcp.client.toolcallback.enabled=true

# 실제 외부 MCP Server
spring.ai.mcp.client.http.connections.deepwiki.url=https://mcp.deepwiki.com
spring.ai.mcp.client.http.connections.deepwiki.endpoint=/mcp

# Logging
logging.level.org.springframework.ai.mcp=DEBUG