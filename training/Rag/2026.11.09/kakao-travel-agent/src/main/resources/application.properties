spring.application.name=kakao-travel-agent

server.port=8060

# OpenAI 
spring.ai.openai.api-key=${OPENAI_API_KEY}
spring.ai.openai.chat.options.model=gpt-4.1-mini
spring.ai.openai.chat.options.temperature=0.3

# Oracle Database
spring.datasource.driver-class-name=oracle.jdbc.OracleDriver
spring.datasource.url=jdbc:oracle:thin:@//localhost:1521/xe
spring.datasource.username=hr
spring.datasource.password=${HR_DB_PASSWORD}

# MCP Client
spring.ai.mcp.client.enabled=false
spring.ai.mcp.client.type=SYNC
spring.ai.mcp.client.request-timeout=60s
spring.ai.mcp.client.toolcallback.enabled=true
spring.ai.mcp.client.streamable-http.connections.playmcp.url=https://playmcp.kakao.com
spring.ai.mcp.client.streamable-http.connections.playmcp.endpoint=/mcp

# PlayMCP
kakao.playmcp.token=${KAKAO_PLAYMCP_TOKEN:}

# 카카오 REST API 키 (장소 상세 페이지 찾기)
kakao.rest-api-key=${KAKAO_REST_API_KEY:}

logging.level.org.springframework.ai.mcp=DEBUG
