spring.application.name=order-mcp-client

server.port=8070

spring.ai.openai.api-key=${OPENAI_API_KEY}
#spring.ai.openai.chat.options.model=gpt-4.1-mini

spring.ai.mcp.client.enabled=true
spring.ai.mcp.client.type=SYNC
spring.ai.mcp.client.toolcallback.enabled=true

# MCP Server 연결 설정
#spring.ai.mcp.client.servers.mcp-server.transport=http
#spring.ai.mcp.client.servers.mcp-server.config.url=http://localhost:8090/mcp

spring.ai.mcp.client.streamable-http.connections.local-server.url=http://localhost:8090
spring.ai.mcp.client.streamable-http.connections.local-server.endpoint=/mcp

logging.level.org.springframework.ai=DEBUG
logging.level.org.springframework.ai.mcp=DEBUG
