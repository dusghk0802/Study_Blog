<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Title</title>
</head>
<body>
<h2>회원 목록</h2>
<thead>
<tr>
    <td>ID</td>
    <td>이름</td>
    <td>이메일</td>
</tr>
</thead>
<tbody>
<tr th:each="member : ${members}">
    <td th:text="${member.id}"></td>
    <td th:text="${member.name}"></td>
    <td th:text="${member.email}"></td>
</tr>
</tbody>
</body>
</html>
