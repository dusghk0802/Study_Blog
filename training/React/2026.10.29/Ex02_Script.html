//Quiz
let myCars;
myCars = {
  "name":"john", 
  "age":30, 
  "cars":[
    {"name":"Ford", "model":["Mustang", "Fous"]},
    {"name":"BMW", "model":["X5", "X7", "X8"]},
    {"name":"Fiat", "model":["500", "Panda"]}
]
}

//1.차량이름과 차량모델만 출력
// Ford: Mustang, Fous
// BMW: X5, X7, X8

for(let obj of myCars.cars){
  document.write("차량이름 : " + obj.name);
  for(let index in obj.model){
    document.write(" " + obj.model[index]);
  }
  document.write("<hr>");
}
