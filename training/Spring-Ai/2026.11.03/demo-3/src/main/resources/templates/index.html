<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ko">
<head>
    <meta charset="UTF-8">
    <title>WebFlux + Thymeleaf 실습</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f3f4f6;
            padding: 40px;
        }

        .container {
            max-width: 700px;
            margin: auto;
            padding: 30px;
            background: white;
            border-radius: 12px;
        }

        button {
            padding: 12px 20px;
            margin: 5px;
            cursor: pointer;
        }

        #messages {
            margin-top: 20px;
            padding: 20px;
            background: #f1f5f9;
            border-radius: 8px;
            min-height: 120px;
        }

        .message {
            margin: 8px 0;
            padding: 10px;
            background: #dcfce7;
            border-radius: 6px;
        }
    </style>
</head>
<body>

<div class="container">

    <h2>Spring WebFlux 실시간 메시지</h2>
    <p>서버에서 1초마다 데이터를 전송합니다.</p>

    <button onclick="startStream()">스트리밍 시작</button>
    <button onclick="stopStream()">중지</button>

    <div id="messages"></div>

</div>

<script>
    let eventSource = null;

    function startStream() {

        stopStream();

        document.getElementById("messages").innerHTML = "";

        // SSE 연결 시작
        eventSource = new EventSource("/stream");

        // 서버 메시지 수신
        eventSource.onmessage = function(event) {

            const div = document.createElement("div");
            div.className = "message";
            div.textContent = event.data;

            document.getElementById("messages")
                    .appendChild(div);
        };

        // 연결 오류 또는 종료
        eventSource.onerror = function() {
            stopStream();
        };
    }

    function stopStream() {

        if (eventSource !== null) {
            eventSource.close();
            eventSource = null;
        }
    }
</script>

</body>
</html>
