<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>영수증 보험금 청구</title>
<style>
  :root {
    --bg: #f3f5f8; --card: #fff; --ink: #18212f; --muted: #667085; --line: #e3e7ed;
    --brand: #1f5eff; --brand-dark: #174ad0;
    --pass: #12805c; --pass-bg: #e6f6f0; --warn: #a35a00; --warn-bg: #fff3df;
    --fail: #c5282f; --fail-bg: #fdecec; --skip: #667085; --skip-bg: #eef0f3;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink);
    font-family: "Malgun Gothic", "Apple SD Gothic Neo", system-ui, sans-serif; font-size: 15px; line-height: 1.5; }
  header { background: var(--card); border-bottom: 1px solid var(--line); padding: 16px 24px; }
  header h1 { margin: 0; font-size: 18px; }
  main { max-width: 1120px; margin: 0 auto; padding: 24px 16px 48px; display: grid; gap: 20px;
    grid-template-columns: 340px minmax(0, 1fr); align-items: start; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 20px; }
  .card + .card { margin-top: 16px; }
  h2 { margin: 0 0 12px; font-size: 16px; }
  .drop { display: block; border: 2px dashed #c4ccd8; border-radius: 10px; padding: 28px 12px; text-align: center;
    color: var(--muted); cursor: pointer; }
  .drop:hover, .drop.over { border-color: var(--brand); background: #f3f6ff; }
  .drop input { position: absolute; width: 1px; height: 1px; opacity: 0; }
  .drop:focus-within { outline: 2px solid var(--brand); outline-offset: 2px; }
  #preview { display: none; width: 100%; max-height: 420px; object-fit: contain; margin-top: 12px;
    border: 1px solid var(--line); border-radius: 8px; background: #fafbfc; }
  button { width: 100%; margin-top: 12px; padding: 12px; border: 0; border-radius: 8px; background: var(--brand);
    color: #fff; font: inherit; font-weight: 700; cursor: pointer; }
  button:hover:not(:disabled) { background: var(--brand-dark); }
  button:disabled { background: #b8c1cf; cursor: not-allowed; }
  .hint { margin: 10px 0 0; color: var(--muted); font-size: 13px; }
  .empty { color: var(--muted); text-align: center; padding: 56px 16px; }
  .spinner { width: 28px; height: 28px; margin: 0 auto 12px; border: 3px solid var(--line); border-top-color: var(--brand);
    border-radius: 50%; animation: spin 1s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .verdict { border-left: 6px solid; }
  .verdict.APPROVED { border-left-color: var(--pass); }
  .verdict.REVIEW { border-left-color: var(--warn); }
  .verdict.REJECTED { border-left-color: var(--fail); }
  .verdict .amount { font-size: 34px; font-weight: 800; margin: 6px 0; }
  .verdict p { margin: 0; color: var(--muted); }
  .badge { display: inline-block; padding: 2px 9px; border-radius: 999px; font-size: 12px; font-weight: 700; white-space: nowrap; }
  .PASS, .APPROVED-badge { color: var(--pass); background: var(--pass-bg); }
  .WARN, .REVIEW-badge { color: var(--warn); background: var(--warn-bg); }
  .FAIL, .REJECTED-badge { color: var(--fail); background: var(--fail-bg); }
  .SKIPPED { color: var(--skip); background: var(--skip-bg); }
  .breakdown { margin: 14px 0 0; padding: 12px 0 0; border-top: 1px solid var(--line); }
  .breakdown div { display: flex; justify-content: space-between; gap: 12px; padding: 3px 0; }
  .breakdown dt { color: var(--muted); }
  .breakdown dd { margin: 0; font-weight: 600; }
  .breakdown .sum { border-top: 1px solid var(--line); margin-top: 6px; padding-top: 8px; }
  .steps details { border-top: 1px solid var(--line); }
  .steps details:first-of-type { border-top: 0; }
  .steps summary { display: flex; align-items: center; gap: 10px; padding: 11px 0; cursor: pointer; list-style: none; }
  .steps summary::-webkit-details-marker { display: none; }
  .steps .no { flex: none; width: 24px; height: 24px; border-radius: 50%; background: var(--skip-bg);
    text-align: center; font-size: 13px; font-weight: 700; line-height: 24px; }
  .steps .title { flex: 1; min-width: 0; }
  .steps .title small { display: block; color: var(--muted); font-size: 13px; }
  .checks { list-style: none; margin: 0 0 12px 34px; padding: 0; }
  .checks li { display: flex; justify-content: space-between; gap: 12px; padding: 6px 0; font-size: 14px; }
  .checks small { display: block; color: var(--muted); font-size: 13px; }
  .table-wrap { overflow-x: auto; }
  table { width: 100%; min-width: 520px; border-collapse: collapse; font-size: 14px; }
  th, td { padding: 9px 8px; border-bottom: 1px solid var(--line); text-align: left; vertical-align: top; }
  th { color: var(--muted); font-weight: 600; font-size: 13px; }
  td small { display: block; color: var(--muted); }
  td.num { text-align: right; }
  tr.excluded td { color: var(--muted); }
  pre { margin: 10px 0 0; max-height: 300px; overflow: auto; padding: 12px; background: #f7f8fa; border-radius: 8px;
    white-space: pre-wrap; word-break: break-word; font: 13px/1.5 Consolas, "Malgun Gothic", monospace; }
  summary.more { cursor: pointer; font-weight: 700; }
  .error { color: var(--fail); background: var(--fail-bg); padding: 12px 14px; border-radius: 8px; }
  @media (max-width: 820px) { main { grid-template-columns: minmax(0, 1fr); } }
</style>
</head>
<body>
<header><h1>영수증 보험금 청구</h1></header>
<main>
  <section class="card">
    <h2>영수증 올리기</h2>
    <label class="drop" id="drop">
      <input type="file" id="file" accept="image/jpeg,image/png">
      <span id="dropText">병원·약국 영수증을 끌어다 놓거나 눌러서 선택하세요</span>
    </label>
    <img id="preview" alt="올린 영수증 미리보기">
    <button id="submit" disabled>분석하기</button>
    <p class="hint">JPG, PNG · 10MB 이하. 영수증 이미지는 분석을 위해 OpenAI와 Google로 전송됩니다.</p>
  </section>

  <section id="result" aria-live="polite">
    <div class="card empty">영수증을 올리면 지급 예상 금액과 단계별 검증 결과가 여기에 표시됩니다.</div>
  </section>
</main>

<script>
  const fileInput = document.getElementById("file");
  const drop = document.getElementById("drop");
  const dropText = document.getElementById("dropText");
  const preview = document.getElementById("preview");
  const submit = document.getElementById("submit");
  const result = document.getElementById("result");

  const STATUS_LABEL = { PASS: "통과", WARN: "확인 필요", FAIL: "실패", SKIPPED: "건너뜀" };
  const DECISION_LABEL = { APPROVED: "지급 승인", REVIEW: "담당자 확인", REJECTED: "지급 불가" };
  const EXCLUDED = ["제증명", "진단서", "소견서", "주차", "식대", "간병", "미용", "성형"];

  const won = n => Number(n).toLocaleString("ko-KR") + "원";

  /** 모든 값은 textContent로 넣어 OCR/AI 결과의 HTML이 실행되지 않게 한다. */
  function el(tag, className, ...children) {
    const node = document.createElement(tag);
    if (className) node.className = className;
    for (const child of children) {
      if (child === null || child === undefined) continue;
      node.append(child);
    }
    return node;
  }

  function selectFile(file) {
    if (!file) return;
    const dt = new DataTransfer();
    dt.items.add(file);
    fileInput.files = dt.files;
    dropText.textContent = file.name;
    if (preview.src) URL.revokeObjectURL(preview.src);
    preview.src = URL.createObjectURL(file);
    preview.style.display = "block";
    submit.disabled = false;
  }

  fileInput.addEventListener("change", () => selectFile(fileInput.files[0]));
  ["dragover", "dragenter"].forEach(type => drop.addEventListener(type, e => { e.preventDefault(); drop.classList.add("over"); }));
  ["dragleave", "drop"].forEach(type => drop.addEventListener(type, e => { e.preventDefault(); drop.classList.remove("over"); }));
  drop.addEventListener("drop", e => selectFile(e.dataTransfer.files[0]));

  submit.addEventListener("click", async () => {
    submit.disabled = true;
    submit.textContent = "분석 중...";
    const spinner = el("div", "card empty", el("div", "spinner"), "OCR과 Vision AI로 영수증을 읽고 있습니다.");
    result.replaceChildren(spinner);

    try {
      const form = new FormData();
      form.append("receipt", fileInput.files[0]);
      const response = await fetch("/api/claims/analyze", { method: "POST", body: form });
      const data = await response.json().catch(() => null);
      if (!response.ok) throw new Error(data?.message || "분석 요청에 실패했습니다. (" + response.status + ")");
      render(data);
    } catch (error) {
      result.replaceChildren(el("div", "card", el("div", "error", error.message)));
    } finally {
      submit.disabled = false;
      submit.textContent = "분석하기";
    }
  });

  function render(data) {
    const nodes = [verdictCard(data)];
    const compare = data.steps.find(s => s.order === 5);
    if (compare && compare.checks.length) nodes.push(compareCard(compare));
    nodes.push(stepsCard(data.steps));
    if (data.vision?.items?.length) nodes.push(itemsCard(data.vision.items));
    if (data.ocr) nodes.push(rawCard(data.ocr));
    result.replaceChildren(...nodes);
  }

  function verdictCard(data) {
    const card = el("div", "card verdict " + data.decision);
    card.append(el("span", "badge " + data.decision + "-badge", DECISION_LABEL[data.decision]));
    if (data.payout && data.decision !== "REJECTED") {
      const label = data.decision === "APPROVED" ? "지급 금액" : "예상 지급액";
      card.append(el("div", "", label), el("div", "amount", won(data.payout.payoutAmount)));
    }
    card.append(el("p", "", data.message));
    if (data.payout) {
      const p = data.payout;
      const dl = el("dl", "breakdown");
      const row = (k, v, cls) => dl.append(el("div", cls, el("dt", "", k), el("dd", "", v)));
      row("청구 금액", won(p.claimedAmount));
      row("보장 제외 항목", "- " + won(p.excludedAmount));
      row("보장 대상 금액", won(p.baseAmount));
      row("본인 부담 공제", "- " + won(p.deductible));
      row("지급 금액", won(p.payoutAmount), "sum");
      card.append(dl);
    }
    return card;
  }

  function compareCard(step) {
    const tbody = el("tbody");
    for (const c of step.checks) {
      tbody.append(el("tr", "",
        el("td", "", c.name),
        el("td", "", c.ocrValue ?? "-"),
        el("td", "", c.visionValue ?? "-"),
        el("td", "", el("span", "badge " + c.status, STATUS_LABEL[c.status]), el("small", "", c.message))));
    }
    const head = el("tr", "", el("th", "", "항목"), el("th", "", "OCR"), el("th", "", "Vision AI"), el("th", "", "결과"));
    return el("div", "card", el("h2", "", "OCR · Vision AI 비교"),
      el("div", "table-wrap", el("table", "", el("thead", "", head), tbody)));
  }

  function stepsCard(steps) {
    const box = el("div", "card steps", el("h2", "", "단계별 검증"));
    for (const s of steps) {
      const details = el("details");
      if (s.status === "FAIL" || s.status === "WARN") details.open = true;
      details.append(el("summary", "",
        el("span", "no", String(s.order)),
        el("span", "title", s.title, el("small", "", s.summary)),
        el("span", "badge " + s.status, STATUS_LABEL[s.status])));
      if (s.checks.length) {
        const list = el("ul", "checks");
        for (const c of s.checks) {
          list.append(el("li", "",
            el("span", "", c.name, el("small", "", c.message)),
            el("span", "", el("span", "badge " + c.status, STATUS_LABEL[c.status]))));
        }
        details.append(list);
      }
      box.append(details);
    }
    return box;
  }

  function itemsCard(items) {
    const tbody = el("tbody");
    for (const item of items) {
      const excluded = EXCLUDED.some(k => (item.name || "").includes(k));
      tbody.append(el("tr", excluded ? "excluded" : "",
        el("td", "", item.name ?? "-", excluded ? el("small", "", "보장 제외") : null),
        el("td", "num", item.amount == null ? "-" : won(item.amount))));
    }
    return el("div", "card", el("h2", "", "Vision AI가 읽은 항목"),
      el("div", "table-wrap", el("table", "", tbody)));
  }

  function rawCard(ocr) {
    return el("div", "card", el("details", "",
      el("summary", "more", "OCR 원문 보기 (신뢰도 " + ocr.confidence + "%)"),
      el("pre", "", ocr.rawText || "")));
  }
</script>
</body>
</html>
