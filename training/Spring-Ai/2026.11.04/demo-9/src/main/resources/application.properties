spring.application.name=demo-9

spring.ai.openai.api-key=${OPENAI_API_KEY}
spring.ai.openai.chat.options.model=gpt-5.4-mini

## 파일 업로드
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=15MB

## OCR (Google Document AI)
# 인증은 환경변수 GOOGLE_APPLICATION_CREDENTIALS 의 JSON 키 파일로 한다
ocr.project-id=project-46269573-fb6d-454a-bd7
ocr.location=us
ocr.processor-id=b48f26677f265bf4

## 보험금 심사 기준 (실습용 예시 값)
# 최소 공제 금액(원)
claim.minimum-deductible=10000
# 본인 부담 비율(%)
claim.deductible-percent=20
# 1건당 지급 한도(원)
claim.payout-limit=5000000
# 이 금액을 넘으면 담당자가 확인(원)
claim.auto-approve-limit=1000000
# 청구 가능 기간(년)
claim.claim-window-years=3
# OCR 신뢰도 기준(%)
claim.ocr-pass-confidence=70
claim.ocr-warn-confidence=40
