<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>게시글 작성 | CINEHUB</title>

  <link rel="stylesheet" href="../css/style.css">
</head>

<body>

  <!-- 홈 이동 -->
  <header>
    <h1>
      <a href="../index.html">CINEHUB</a>
    </h1>
  </header>

  <main>

    <!-- 게시글 작성 전체 영역 -->
    <section class="write-container">

      <!-- 글쓰기 상단 -->
      <div class="write-header">

        <h2>글쓰기</h2>

        <div>
          <button
            type="button"
            onclick="location.href='list.html'"
          >
            취소
          </button>

          <button
            type="submit"
            form="post-form"
          >
            등록
          </button>
        </div>

      </div>

      <!-- 게시글 작성 -->
      <form id="post-form">

        <!-- 카테고리 -->
        <div class="write-category">

          <label for="category">
            카테고리
          </label>

          <select id="category" name="category">
            <option value="">카테고리 선택</option>
            <option value="review">영화리뷰</option>
            <option value="recommend">영화추천</option>
          </select>

        </div>

        <!-- 제목 -->
        <div class="write-title">

          <input
            type="text"
            id="title"
            name="title"
            class="title-input"
            placeholder="제목을 입력하세요"
          >

        </div>

        <!-- 영화 첨부 -->
        <div class="movie-attach">

          <h3>영화 첨부</h3>

          <!-- 영화가 선택되지 않은 경우 -->
          <button type="button">
            영화검색
          </button>

          <!-- 영화가 선택된 경우 -->
          <div class="selected-movie">

            <span>
              인셉션 (2010)

              <button type="button">
                X
              </button>
            </span>

          </div>

        </div>

        <!-- 본문 에디터 도구 -->
        <div class="editor-toolbar">

        <!-- 글꼴 -->
        <select name="font-family">
         <option value="">글꼴</option>
         <option value="default">기본 글꼴</option>
         <option value="gothic">고딕체</option>
         <option value="serif">명조체</option>
        </select>

        <!-- 글자 크기 -->
       <select name="font-size">
       <option value="">글자 크기</option>
       <option value="small">작게</option>
       <option value="normal">보통</option>
       <option value="large">크게</option>
       </select>

      <span class="toolbar-divider"></span>

       <!-- 글자 스타일 -->
       <button type="button" title="굵게">
        <strong>B</strong>
       </button>

       <button type="button" title="기울임">
        <em>I</em>
       </button>

       <button type="button" title="밑줄">
        <u>U</u>
       </button>

       <button type="button" title="취소선">
        <s>S</s>
       </button>

       <span class="toolbar-divider"></span>

       <!-- 정렬 -->
       <button type="button" title="왼쪽 정렬">
       왼쪽
       </button>

       <button type="button" title="가운데 정렬">
       가운데
       </button>

       <button type="button" title="오른쪽 정렬">
       오른쪽
       </button>

       <span class="toolbar-divider"></span>

       <!-- 콘텐츠 -->
       <button type="button" title="목록">
       목록
       </button>

       <button type="button" title="링크">
       링크
       </button>

       <button type="button" title="이미지">
       이미지
       </button>

       <button type="button" title="이모티콘">
       😊
       </button>

       <button type="button" title="특수문자">
       Ω
       </button>

       </div>

        <!-- 본문 -->
        <div>

          <textarea
            id="content"
            name="content"
            class="content-editor"
            placeholder="영화에 대한 이야기를 자유롭게 작성해보세요."
          ></textarea>

        </div>

      </form>

    </section>

  </main>

</body>
</html>
