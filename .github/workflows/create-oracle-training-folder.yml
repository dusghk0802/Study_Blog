name: Create scheduled study folders

on:
  schedule:
    # 15:00 UTC is 00:00 the next day in Asia/Seoul.
    - cron: "0 15 * * *"
  workflow_dispatch:
    inputs:
      target_date:
        description: "YYYY-MM-DD or YYYY.MM.DD date to create. Defaults to today's date in Asia/Seoul."
        required: false
        type: string

permissions:
  contents: write

jobs:
  create-folder:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Resolve target date
        id: date
        env:
          INPUT_DATE: ${{ inputs.target_date }}
        run: |
          set -euo pipefail

          if [ -n "${INPUT_DATE:-}" ]; then
            target_date="${INPUT_DATE//./-}"
          else
            target_date="$(TZ=Asia/Seoul date +%F)"
          fi

          echo "target_date=$target_date" >> "$GITHUB_OUTPUT"

      - name: Create and push scheduled folders
        run: |
          set -euo pipefail

          target_date="${{ steps.date.outputs.target_date }}"

          if ! [[ "$target_date" =~ ^2026-[0-9]{2}-[0-9]{2}$ ]]; then
            echo "$target_date is not a valid 2026 date."
            exit 0
          fi

          if ! TZ=Asia/Seoul date -d "$target_date" +%F >/dev/null 2>&1; then
            echo "$target_date is not a valid date."
            exit 0
          fi

          weekday="$(TZ=Asia/Seoul date -d "$target_date" +%u)"

          if [[ "$target_date" > "2026-06-30" && "$target_date" < "2026-09-01" && "$weekday" -gt 5 ]]; then
            echo "$target_date is a July/August weekend, so no folder will be created."
            exit 0
          fi

          if [[ "$target_date" > "2026-08-31" && "$weekday" -gt 6 ]]; then
            echo "$target_date is a Sunday, so no folder will be created."
            exit 0
          fi

          case "$target_date" in
            2026-09-24|2026-09-25)
              echo "$target_date is during the Chuseok holiday, so no folder will be created."
              exit 0
              ;;
          esac

          date_folder="${target_date//-/.}"
          folders=()
          created_paths=()

          add_range() {
            local start_date="$1"
            local end_date="$2"
            local parent_folder="$3"
            local child_folder="${4:-$date_folder}"

            if [[ "$target_date" < "$start_date" || "$target_date" > "$end_date" ]]; then
              return
            fi

            folders+=("$parent_folder/$child_folder")
          }

          add_range "2026-07-20" "2026-07-24" "training/Oracle" "$target_date"
          add_range "2026-07-27" "2026-07-29" "training/Oracle" "$target_date"
          add_range "2026-07-30" "2026-08-11" "training/Java"
          add_range "2026-08-12" "2026-08-30" "training/Web"
          add_range "2026-08-24" "2026-09-02" "projects/mini-project-01"
          add_range "2026-09-03" "2026-09-12" "training/Spring-Boot"
          add_range "2026-09-14" "2026-09-17" "training/React"
          add_range "2026-09-18" "2026-09-23" "training/Ai-Service-Deployment"
          add_range "2026-09-26" "2026-10-10" "projects/mini-project-02"
          add_range "2026-10-12" "2026-10-24" "training/Python"
          add_range "2026-10-26" "2026-11-06" "training/Spring-Ai"
          add_range "2026-11-07" "2026-11-17" "training/Rag"
          add_range "2026-11-18" "2026-12-18" "projects/final-project"

          if [ "${#folders[@]}" -eq 0 ]; then
            echo "$target_date is not in the scheduled folder ranges."
            exit 0
          fi

          for folder in "${folders[@]}"; do
            mkdir -p "$folder"
            keep_file="$folder/.gitkeep"

            if [ ! -e "$keep_file" ]; then
              touch "$keep_file"
            fi

            if [ -n "$(git status --short -- "$keep_file")" ]; then
              created_paths+=("$keep_file")
            else
              echo "$folder already exists."
            fi
          done

          if [ "${#created_paths[@]}" -eq 0 ]; then
            echo "No new folders to commit for $target_date."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "${created_paths[@]}"
          git commit -m "Create study folders for $date_folder"
          git push
